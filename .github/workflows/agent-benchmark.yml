name: WorkWorld Release CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workworld-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Release gates and isolated PostgreSQL RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workworld_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workworld_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WW_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/workworld_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrate the disposable CI database
        run: node scripts/apply-migrations.mjs
      - name: Install the browser used by the release gate
        run: npx playwright install --with-deps chromium
      - run: npm run release-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-evidence
          path: |
            evidence/release-gate/latest.json
            test-results/
